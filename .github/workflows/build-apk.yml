name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Android SDK가 미리 설치된 이미지로 고정
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK 만들기
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gangho-yurang-apk
          path: app/build/outputs/apk/release/*.apk

      - name: 릴리스 페이지에 APK 게시
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          cp app/build/outputs/apk/release/app-release.apk "gangho-yurang-v$V.apk"
          gh release delete "v$V" -y --cleanup-tag || true
          gh release create "v$V" "gangho-yurang-v$V.apk" --title "강호유랑 v$V" --latest \
            --notes "휴대폰에서 아래 gangho-yurang-v$V.apk 를 눌러 내려받은 뒤 설치하세요. (처음 한 번 '출처를 알 수 없는 앱' 허용 필요)"
